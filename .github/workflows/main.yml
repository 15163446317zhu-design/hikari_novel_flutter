name: Build Flutter APK
on:
  workflow_dispatch: # 支持在GitHub网页手动点击运行打包
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17（安卓编译必需）
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # flutter-version: '3.22.0'  # 可选：固定你的flutter版本

      - name: 拉取依赖
        run: flutter pub get

      - name: 编译 Release APK
        run: flutter build apk --release --split-per-abi

      - name: 上传APK为制品（打包完可以下载）
        uses: actions/upload-artifact@v4
        with:
          name: apk文件
          path: build/app/outputs/apk/release/
